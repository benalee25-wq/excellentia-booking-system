<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Excellentia Digital Solutions and More</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-950:#0B1526;
    --navy-900:#0F1E33;
    --navy-800:#152A45;
    --navy-700:#1D3A5C;
    --line:#2A4363;
    --ink:#F3F6FA;
    --ink-muted:#9FB2C8;
    --ink-faint:#6B8099;
    --amber:#E6A94A;
    --teal:#4FB8A8;
    --rose:#D9738A;
    --violet:#8C8FE0;
    --danger:#E07868;
    --radius-sm:10px;
    --radius-md:16px;
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--navy-950);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3,.brand{font-family:'Sora',system-ui,sans-serif;}
  a{color:inherit;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 18px;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  header{border-bottom:1px solid var(--line);padding:16px 0;}
  .head-row{display:flex;align-items:center;justify-content:space-between;}
  .brand{font-weight:700;font-size:0.95rem;}
  .brand span{display:block;font-family:'Inter';font-weight:500;font-size:0.6rem;color:var(--ink-faint);margin-top:2px;}
  .head-actions{display:flex;align-items:center;gap:10px;}
  .pill-btn{
    font-size:0.82rem;color:var(--ink-muted);border:1px solid var(--line);
    padding:8px 14px;border-radius:999px;background:none;
  }
  .pill-btn:hover{color:var(--ink);border-color:var(--ink-faint);}

  /* ===== Login screen ===== */
  .login-shell{
    min-height:calc(100vh - 60px);display:flex;align-items:center;justify-content:center;padding:24px 18px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--navy-800);border:1px solid var(--line);
    border-radius:var(--radius-md);padding:32px 26px;
  }
  .login-card h2{font-size:1.3rem;font-weight:700;margin-bottom:6px;}
  .login-card p.sub{color:var(--ink-muted);font-size:0.88rem;margin-bottom:26px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.83rem;font-weight:600;margin-bottom:7px;}
  .field input{
    width:100%;background:var(--navy-900);border:1.5px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 14px;color:var(--ink);font-size:0.92rem;
  }
  .field input:focus{outline:none;border-color:var(--amber);}
  .login-err{color:var(--danger);font-size:0.83rem;margin-bottom:14px;display:none;}
  .btn-primary{
    background:var(--amber);color:var(--navy-950);font-weight:600;padding:13px 20px;
    border-radius:999px;border:none;font-size:0.92rem;width:100%;
  }
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{opacity:0.6;}

  /* ===== Dashboard ===== */
  main{padding:28px 0 60px;display:none;}
  .page-title{font-size:1.4rem;font-weight:700;margin-bottom:4px;}
  .page-sub{color:var(--ink-muted);font-size:0.88rem;margin-bottom:26px;}

  .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:28px;}
  @media(min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
  .stat-card{background:var(--navy-800);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px 18px;}
  .stat-card .n{font-family:'Sora';font-size:1.5rem;font-weight:700;}
  .stat-card .l{color:var(--ink-faint);font-size:0.78rem;margin-top:2px;}

  .filter-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
  .filter-chip{
    flex:0 0 auto;font-size:0.82rem;color:var(--ink-muted);border:1px solid var(--line);
    padding:8px 16px;border-radius:999px;background:none;white-space:nowrap;
  }
  .filter-chip.active{border-color:var(--amber);color:var(--ink);background:var(--navy-700);}

  .booking-list{display:flex;flex-direction:column;gap:10px;}
  .booking-card{
    background:var(--navy-800);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:16px 18px;cursor:pointer;
  }
  .bk-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .bk-ref{font-family:'Sora';font-weight:700;font-size:0.85rem;color:var(--amber);}
  .bk-service{font-weight:600;font-size:0.95rem;margin-top:4px;}
  .bk-meta{color:var(--ink-muted);font-size:0.82rem;margin-top:3px;}
  .status-badge{
    font-size:0.72rem;font-weight:600;padding:4px 11px;border-radius:999px;white-space:nowrap;
  }
  .status-Pending{background:rgba(230,169,74,0.18);color:var(--amber);}
  .status-Confirmed{background:rgba(79,184,168,0.18);color:var(--teal);}
  .status-In_Progress{background:rgba(140,143,224,0.18);color:var(--violet);}
  .status-Completed{background:rgba(79,184,168,0.28);color:var(--teal);}
  .status-Cancelled{background:rgba(224,120,104,0.18);color:var(--danger);}
  .status-Rescheduled{background:rgba(217,115,138,0.18);color:var(--rose);}

  .bk-detail{
    margin-top:14px;padding-top:14px;border-top:1px solid var(--line);
    display:none;flex-direction:column;gap:10px;
  }
  .bk-detail.open{display:flex;}
  .detail-row{display:flex;justify-content:space-between;font-size:0.85rem;gap:14px;}
  .detail-row .k{color:var(--ink-faint);flex-shrink:0;}
  .detail-row .v{text-align:right;}
  .detail-desc{font-size:0.85rem;color:var(--ink-muted);background:var(--navy-900);padding:10px 12px;border-radius:var(--radius-sm);}

  .status-select{
    background:var(--navy-900);border:1.5px solid var(--line);border-radius:var(--radius-sm);
    padding:9px 12px;color:var(--ink);font-size:0.85rem;width:100%;margin-top:4px;
  }
  .update-btn{
    background:var(--teal);color:var(--navy-950);font-weight:600;padding:10px 16px;
    border-radius:999px;border:none;font-size:0.85rem;margin-top:4px;
  }
  .update-btn:disabled{opacity:0.6;}

  .empty-state{color:var(--ink-faint);font-size:0.9rem;padding:40px 0;text-align:center;}
  .load-msg{color:var(--ink-muted);font-size:0.9rem;padding:20px 0;}
</style>
</head>
<body>

<header>
  <div class="wrap head-row">
    <a href="index.html" class="brand">EXCELLENTIA <span>ADMIN</span></a>
    <div class="head-actions" id="headActions"></div>
  </div>
</header>

<!-- LOGIN -->
<div class="login-shell" id="loginShell">
  <div class="login-card">
    <h2>Admin sign in</h2>
    <p class="sub">Manage bookings for Excellentia Digital Solutions and More.</p>
    <div class="login-err" id="loginErr"></div>
    <div class="field"><label>Email</label><input type="email" id="loginEmail" autocomplete="username"></div>
    <div class="field"><label>Password</label><input type="password" id="loginPass" autocomplete="current-password"></div>
    <button class="btn-primary" id="loginBtn">Sign In</button>
  </div>
</div>

<!-- DASHBOARD -->
<main class="wrap" id="dashboard">
  <div class="page-title">Bookings</div>
  <div class="page-sub" id="pageSub">Loading…</div>

  <div class="stat-grid" id="statGrid"></div>

  <div class="filter-row" id="filterRow"></div>

  <div class="booking-list" id="bookingList"></div>
</main>

<script>
const SUPABASE_URL = "https://ffapogcwklcjadsepqaq.supabase.co";
const SUPABASE_KEY = "sb_publishable_OTZkjIi_TNvigEIVZINdow_EtL2Tdc3";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STATUSES = ["Pending","Confirmed","In Progress","Completed","Cancelled","Rescheduled"];
let allBookings = [];
let activeFilter = "All";
let openCardId = null;

/* ---------- Auth ---------- */
async function checkSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session){
    await tryEnterDashboard();
  }
}

document.getElementById('loginBtn').addEventListener('click', async ()=>{
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errBox = document.getElementById('loginErr');
  errBox.style.display = 'none';
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';

  const { error } = await sb.auth.signInWithPassword({ email, password: pass });

  if(error){
    errBox.textContent = error.message;
    errBox.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Sign In';
    return;
  }
  await tryEnterDashboard();
});

async function tryEnterDashboard(){
  // Confirm this logged-in user is actually in the admins table
  const { data: adminRow, error } = await sb
    .from('admins')
    .select('id, name')
    .single();

  if(error || !adminRow){
    document.getElementById('loginErr').textContent = "This account isn't authorized as an admin.";
    document.getElementById('loginErr').style.display = 'block';
    await sb.auth.signOut();
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'Sign In';
    return;
  }

  document.getElementById('loginShell').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('headActions').innerHTML = `<button class="pill-btn" id="signOutBtn">Sign Out</button>`;
  document.getElementById('signOutBtn').addEventListener('click', async ()=>{
    await sb.auth.signOut();
    location.reload();
  });

  loadBookings();
}

/* ---------- Load + render bookings ---------- */
async function loadBookings(){
  document.getElementById('pageSub').textContent = 'Loading bookings…';
  const { data, error } = await sb
    .from('bookings')
    .select('*')
    .order('created_at', { ascending:false });

  if(error){
    document.getElementById('pageSub').textContent = 'Could not load bookings: ' + error.message;
    return;
  }

  allBookings = data;
  document.getElementById('pageSub').textContent = `${allBookings.length} booking${allBookings.length===1?'':'s'} total`;
  renderStats();
  renderFilters();
  renderList();
}

function renderStats(){
  const today = new Date().toISOString().split('T')[0];
  const stats = [
    { label:'Total Bookings', value: allBookings.length },
    { label:"Today's Bookings", value: allBookings.filter(b=>b.booking_date===today).length },
    { label:'Pending', value: allBookings.filter(b=>b.status==='Pending').length },
    { label:'Completed', value: allBookings.filter(b=>b.status==='Completed').length },
  ];
  document.getElementById('statGrid').innerHTML = stats.map(s=>`
    <div class="stat-card"><div class="n">${s.value}</div><div class="l">${s.label}</div></div>
  `).join('');
}

function renderFilters(){
  const filters = ["All", ...STATUSES];
  document.getElementById('filterRow').innerHTML = filters.map(f=>`
    <button class="filter-chip${activeFilter===f?' active':''}" data-f="${f}">${f}</button>
  `).join('');
  document.querySelectorAll('.filter-chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{ activeFilter = btn.dataset.f; renderFilters(); renderList(); });
  });
}

function renderList(){
  const list = document.getElementById('bookingList');
  const filtered = activeFilter==='All' ? allBookings : allBookings.filter(b=>b.status===activeFilter);

  if(filtered.length===0){
    list.innerHTML = `<div class="empty-state">No bookings in this category.</div>`;
    return;
  }

  list.innerHTML = filtered.map(b => {
    const statusClass = 'status-' + b.status.replace(/\s+/g,'_');
    const isOpen = openCardId === b.id;
    return `
      <div class="booking-card" data-id="${b.id}">
        <div class="bk-top">
          <div>
            <div class="bk-ref">${b.booking_ref}</div>
            <div class="bk-service">${b.service_name} — ${b.service_type}</div>
            <div class="bk-meta">${b.booking_date} · ${b.booking_time} · ${b.customer_name}</div>
          </div>
          <span class="status-badge ${statusClass}">${b.status}</span>
        </div>
        <div class="bk-detail${isOpen?' open':''}" id="detail-${b.id}">
          <div class="detail-row"><span class="k">Phone</span><span class="v">${b.customer_phone}</span></div>
          <div class="detail-row"><span class="k">Email</span><span class="v">${b.customer_email}</span></div>
          <div class="detail-row"><span class="k">Contact pref.</span><span class="v">${b.contact_preference||'—'}</span></div>
          <div class="detail-row"><span class="k">Payment</span><span class="v">${b.payment_option}</span></div>
          <div class="detail-row"><span class="k">Submitted</span><span class="v">${new Date(b.created_at).toLocaleString()}</span></div>
          <div class="detail-desc">${b.description}</div>
          ${b.special_instructions ? `<div class="detail-desc">Instructions: ${b.special_instructions}</div>` : ''}
          <div>
            <label style="font-size:0.8rem;color:var(--ink-faint);">Update status</label>
            <select class="status-select" data-id="${b.id}">
              ${STATUSES.map(s=>`<option value="${s}" ${s===b.status?'selected':''}>${s}</option>`).join('')}
            </select>
            <button class="update-btn" data-id="${b.id}">Save Status</button>
          </div>
        </div>
      </div>
    `;
  }).join('');

  document.querySelectorAll('.booking-card').forEach(card=>{
    card.addEventListener('click', (e)=>{
      if(e.target.closest('.status-select') || e.target.closest('.update-btn')) return;
      const id = card.dataset.id;
      openCardId = openCardId === id ? null : id;
      renderList();
    });
  });

  document.querySelectorAll('.update-btn').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const id = btn.dataset.id;
      const select = document.querySelector(`.status-select[data-id="${id}"]`);
      const newStatus = select.value;
      btn.disabled = true; btn.textContent = 'Saving…';

      const { error } = await sb.from('bookings').update({ status: newStatus, updated_at: new Date().toISOString() }).eq('id', id);

      if(error){
        alert('Could not update status: ' + error.message);
        btn.disabled = false; btn.textContent = 'Save Status';
        return;
      }
      await loadBookings();
    });
  });
}

checkSession();
</script>
</body>
</html>
